version: 2
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DHI_USERNAME}}
    password: ${{secrets.DHI_TOKEN}}
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    registries:
      - dhi
    commit-message:
      prefix: build
      include: scope
