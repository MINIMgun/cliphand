name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - "**.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version used in the archive names, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build
        run: cargo build --release --locked --package cliphand --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${INPUT_VERSION:-snapshot-${GITHUB_SHA::7}}"
          name="cliphand-${version}-${TARGET}"
          mkdir -p "package/${name}"
          cp README.md LICENSE "package/${name}/"
          if [[ "${TARGET}" == *windows* ]]; then
            cp "target/${TARGET}/release/cliphand.exe" "package/${name}/"
            (cd package && 7z a -bso0 "${name}.zip" "${name}")
            echo "ARCHIVE=package/${name}.zip" >> "${GITHUB_ENV}"
          else
            cp "target/${TARGET}/release/cliphand" "package/${name}/"
            tar -C package -czf "package/${name}.tar.gz" "${name}"
            echo "ARCHIVE=package/${name}.tar.gz" >> "${GITHUB_ENV}"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cliphand-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
