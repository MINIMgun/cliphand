name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  binaries:
    name: Publish binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cliphand-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        working-directory: dist
        run: sha256sum cliphand-* > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cliphand-*
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}"

  docker:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/minimgun/cliphand
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cliphand-*-linux-musl
          merge-multiple: true
          path: artifacts
      - name: Extract binaries per platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            triple="${pair#*:}-unknown-linux-musl"
            mkdir -p "dist/linux/${arch}"
            tar -xzf artifacts/cliphand-*-"${triple}".tar.gz -C "dist/linux/${arch}" \
              --strip-components=1 --wildcards '*/cliphand' '*/LICENSE' '*/THIRD-PARTY-LICENSES.md'
          done
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.authors=MINIMgun
            org.opencontainers.image.vendor=MINIMgun
            org.opencontainers.image.documentation=https://github.com/MINIMgun/cliphand#readme
          annotations: |
            org.opencontainers.image.authors=MINIMgun
            org.opencontainers.image.vendor=MINIMgun
            org.opencontainers.image.documentation=https://github.com/MINIMgun/cliphand#readme
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish release
    needs:
      - binaries
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "${TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
